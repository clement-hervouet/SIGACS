# Mosquitto configuration for the Parc stack
# Place this file at: mosquitto/config/mosquitto.conf

# Plain listener (used by healthcheck only)
listener 1883
allow_anonymous true

log_type error
log_type notice
log_type information
log_type debug

# TLS listener
listener 8883
protocol mqtt
allow_anonymous true

log_type error
log_type notice
log_type information
log_type debug

# Certificates

cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

require_certificate true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all

# Connection message logging
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
