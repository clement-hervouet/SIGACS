; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; PlatformIO Project Configuration File
;
; SIGACS - Multi-cartes MQTT (3 ESP32 + 1 M5Stack Core2)

[env:esp32_sol]
platform = espressif32@6.7.0
board = m5stick-c
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<main_esp32_air.cpp> -<main_esp32_lumiere.cpp> -<main_m5stack_serre1.cpp>
lib_deps =
    knolleary/PubSubClient@^2.8
    adafruit/DHT sensor library@^1.4.4
build_flags =
    -DCORE_DEBUG_LEVEL=3

[env:esp32_air]
platform = espressif32@6.7.0
board = m5stick-c
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<main_esp32_sol.cpp> -<main_esp32_lumiere.cpp> -<main_m5stack_serre1.cpp>
lib_deps =
    knolleary/PubSubClient@^2.8
    adafruit/DHT sensor library@^1.4.4
build_flags =
    -DCORE_DEBUG_LEVEL=3

[env:esp32_lumiere]
platform = espressif32@6.7.0
board = m5stick-c
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<main_esp32_sol.cpp> -<main_esp32_air.cpp> -<main_m5stack_serre1.cpp>
lib_deps =
    knolleary/PubSubClient@^2.8
build_flags =
    -DCORE_DEBUG_LEVEL=3

[env:m5stack_serre1]
platform = espressif32@6.7.0
board = m5stack-core2          ; M5Stack Core2 ou m5stick-c
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<main_esp32_sol.cpp> -<main_esp32_air.cpp> -<main_esp32_lumiere.cpp>
lib_deps =
    m5stack/M5Unified@^0.1.8
    knolleary/PubSubClient@^2.8
build_flags =
    -DCORE_DEBUG_LEVEL=3
