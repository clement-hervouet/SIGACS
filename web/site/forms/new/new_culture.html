<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
    <script src="../forms.js"></script>

    <link rel="stylesheet" href="../forms.css">
</head>
<body>
    <div class="form edit" id="formModal"> <!--une fois les tests terminé, enlever la class suplémentaire à form: elle sera ajouté via le js en fonction du bouton-->
        <div class="form-content ">
            <div class="form-header">
                <h2>Nouvelle culture</h2>
            </div>

            <div class="form-body">

                <div class="input">
                    <label for="nom">Nom</label>
                    <input type="text" minlength="5" maxlength="25" placeholder="Serre de Riri" required name="nom" id="nom">
                </div>

                <div class="input">
                    <input type="submit" hidden>
                </div>

            </div>
            <div class="form-footer">
                <input class="cancel" type="button" value="annuler" id="formCancel">
                <input class="submit" type="submit" value="valider" id="formSubmit">
            </div>
        </div>
    </div>
</body>
</html>
